
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY BDT PRO - Digital Wallet</title>
    <style>
        :root {
            --primary-color: #006a4e;
            --secondary-color: #f4f7f6;
            --accent-color: #f42a41;
            --text-color: #333;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--secondary-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .wallet-container {
            width: 100%;
            max-width: 400px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            margin: 15px;
        }
        .header {
            background: var(--primary-color);
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .balance-card {
            background: linear-gradient(135deg, #006a4e, #004d37);
            color: white;
            margin: 20px;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .balance-card h2 {
            font-size: 16px;
            font-weight: 400;
            opacity: 0.9;
        }
        .balance-card .amount {
            font-size: 32px;
            font-weight: bold;
            margin-top: 10px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 0 20px 20px 20px;
        }
        .menu-item {
            background: var(--secondary-color);
            border: none;
            padding: 15px 10px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .menu-item:active {
            transform: scale(0.95);
            background: #e2e8e6;
        }
        .menu-item span {
            font-size: 14px;
            font-weight: 600;
            color: var(--primary-color);
        }
        .section-title {
            padding: 0 20px 10px 20px;
            font-size: 16px;
            font-weight: bold;
            color: #555;
        }
        .transactions {
            padding: 0 20px 20px 20px;
            max-height: 200px;
            overflow-y: auto;
        }
        .tx-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        .tx-amount {
            font-weight: bold;
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="wallet-container">
        <div class="header">
            <h1>MY BDT PRO</h1>
            <p>আপনার নিরাপদ ডিজিটাল ওয়ালেট</p>
        </div>

        <div class="balance-card">
            <h2>মোট ব্যালেন্স</h2>
            <div class="amount">৳ ২৫,৪৫০.০০</div>
        </div>

        <div class="section-title">সেবাসমূহ</div>
        <div class="menu-grid">
            <button class="menu-item" onclick="alert('সেন্ড মানি ফিচারটি চালু আছে')">
                <span>📤 সেন্ড মানি</span>
            </button>
            <button class="menu-item" onclick="alert('ক্যাশ আউট ফিচারটি চালু আছে')">
                <span>💸 ক্যাশ আউট</span>
            </button>
            <button class="menu-item" onclick="alert('মোবাইল রিচার্জ ফিচারটি চালু আছে')">
                <span>📱 রিচার্জ</span>
            </button>
            <button class="menu-item" onclick="alert('বিল পেমেন্ট ফিচারটি চালু আছে')">
                <span>💡 বিল পে</span>
            </button>
            <button class="menu-item" onclick="alert('సేভিংস হিস্ট্রি')">
                <span>💰 জমানো</span>
            </button>
            <button class="menu-item" onclick="alert('প্রোফাইল সেটিংস')">
                <span>⚙️ সেটিংস</span>
            </button>
        </div>

        <div class="section-title">हालिया লেনদেন (Recent Transactions)</div>
        <div class="transactions">
            <div class="tx-item">
                <span>মোবাইল রিচার্জ (Grameenphone)</span>
                <span class="tx-amount">-৳ ৫০.০০</span>
            </div>
            <div class="tx-item">
                <span>ক্যাশ ইন (Add Money)</span>
                <span class="tx-amount" style="color: green;">+৳ ৫,০০০.০০</span>
            </div>
            <div class="tx-item">
                <span>সেন্ড মানি (Irfan)</span>
                <span class="tx-amount">-৳ ১,২০০.০০</span>
            </div>
        </div>
    </div>

</body>
</html>
